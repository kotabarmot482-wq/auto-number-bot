<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>AUTO NUMBER BOT</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">AN</div>
      <div class="brand-copy"><b>AUTO NUMBER</b><span>COLLECTOR CLUB</span></div>
      <div class="balance-pill"><span>₽</span><b id="balance">1 000</b></div>
    </header>
    <main id="screen" class="screen"></main>
    <nav class="nav">
      <button class="nav-btn active" data-tab="home"><span>🎰</span>Крутить</button>
      <button class="nav-btn" data-tab="garage"><span>🚘</span>Гараж</button>
      <button class="nav-btn" data-tab="wheel"><span>🎡</span>Колесо</button>
      <button class="nav-btn" data-tab="frames"><span>🖼️</span>Рамки</button>
      <button class="nav-btn" data-tab="profile"><span>👤</span>Профиль</button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
