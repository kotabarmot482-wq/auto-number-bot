<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#090a0d">
  <title>AUTO NUMBER BOT</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">AN<span>B</span></div><div><b>AUTO NUMBER</b><small>COLLECTOR CLUB</small></div></div>
      <button class="wallet" id="wallet"><small>БАЛАНС</small><b><span id="balance">12 500</span> ₽</b></button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav">
      <button data-tab="home" class="active"><i>⌂</i><span>Главная</span></button>
      <button data-tab="garage"><i>▤</i><span>Гараж</span></button>
      <button data-tab="rating"><i>♛</i><span>Рейтинг</span></button>
      <button data-tab="tasks"><i>✓</i><span>Задания</span></button>
      <button data-tab="friends"><i>♧</i><span>Друзья</span></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
